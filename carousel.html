<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Gallery Showcase</title>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #111; /* Matches your gallery background color */
      color: white;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .gallery-container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 { margin-bottom: 5px; font-size: 1.8rem; }
    h2 { margin-top: 0; font-size: 1.2rem; color: #aaa; font-weight: normal; margin-bottom: 20px;}
    
    /* Main Large Display Image */
    .main-display {
      width: 100%;
      height: 450px;
      object-fit: contain;
      background: #222;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Thumbnail Container */
    .thumbnail-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.6;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .thumb:hover, .active {
      opacity: 1;
      border-color: #FF9E7D;
    }
    
    /* Order Button Placement inside Gallery */
    .order-btn {
      margin-top: 25px;
      background-color: #FF9E7D;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .order-btn:hover { background-color: #FF9E7D; }

    .back-btn {
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      display: block;
    }
    .back-btn:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="gallery-container">
    <!-- Dynamic Product Headings -->
    <h1 id="productTitle">Look Gallery</h1>
    <h2 id="productDesc">Loading details...</h2>

    <!-- Main View -->
    <img id="mainImage" class="main-display" src="assets/hero-image-1.jpg" alt="Product Main View">

    <!-- Clickable Thumbnails -->
    <div class="thumbnail-row" id="thumbRow">
      <!-- Generated automatically by JavaScript below -->
    </div>

    <!-- Direct link to Order form -->
    <a href="#" id="orderBtnLink" class="order-btn">I want this!</a>
    
    <a href="javascript:window.close();" class="back-btn">← Close Gallery Tab</a>
  </div>

<script>
  // 1. Data mapping for your professional case studies (Fully Branded)
    const productData = {
    "1": { title: "LogicMinds.", desc: "LogicMinds serves as an enterprise-grade operational ecosystem engineered to streamline organizational performance through automated SaaS workflow optimization dashboards. The platform integrates complex business data streams into a single source of truth, utilizing automated behavioral triggers to eliminate operational drop-off zones and bottlenecks. By transforming manual procedures into highly efficient automated routines, it allows high-growth ventures to maximize resource efficiency and scale their software infrastructure seamlessly.",
     images: ["assets/carousel-image-1a.jpg", "assets/carousel-image-1b.jpg", "assets/carousel-image-1c.jpg"] },

    "2": { title: "TaskGuru", desc: "TaskGuru serves as an indispensable daily digital prototype tool engineered to streamline individual productivity and lifestyle routines. The platform transforms chaotic to-do lists into structured, high-efficiency workflows, allowing users to organize daily responsibilities, track habitude streaks, and optimize time allocation. By acting as a central dashboard for personal time management, it eliminates mental friction and keeps creators focused on executing their highest-priority objectives every single day.",
     images: ["assets/carousel-image-2a.jpg", "assets/carousel-image-2b.jpg", "assets/carousel-image-2c.jpg"] },

    "3": { title: "Trusswork", desc: "Trusswork serves as an indispensable, Class A-grade corporate operations hub engineered to streamline daily task management and cross-departmental communication. The platform acts as a unified digital infrastructure that connects teams, automates task assignments, and eliminates operational silos to keep interdepartmental projects on schedule. By integrating high-level project workflows with secure, real-time messaging networks, it optimizes corporate resource efficiency and provides an uncompromised single source of truth for daily enterprise operations.",
     images: ["assets/carousel-image-3a.jpg", "assets/carousel-image-3b.jpg", "assets/carousel-image-3c.jpg"] },

    "4": { title: "BlindSpot", desc: "BlindSpot is an elite operational repository providing deployment-ready blueprints, customer support architectures, and conversion frameworks tailored for high-growth tech ventures. The platform delivers structured customer service scripts, pre-sales landing page assets, and optimization strategies for Progressive Web Apps (PWAs) to minimize churn and isolate user friction points. Moving past surface-level metrics, it breaks down advanced behavioral mechanics to help creators build frictionless, high-converting digital storefronts and robust blog layouts.",
     images: ["assets/carousel-image-4a.jpg", "assets/carousel-image-4b.jpg", "assets/carousel-image-4c.jpg"] },

    "5": { title: "Tabula", desc: "Tabula serves as an indispensable digital school buddy engineered to streamline daily task management and student engagement directly on their personal devices. The platform acts as a highly student-friendly dashboard, transforming complex assignment schedules, project deadlines, and extracurricular activities into structured, easy-to-navigate daily routines. By eliminating academic friction and keeping track of classroom deliverables, it empowers students to take full control of their educational journey right from their screens.",
     images: ["assets/carousel-image-5a.jpg", "assets/carousel-image-5b.jpg", "assets/carousel-image-5c.jpg"] },

    "6": { title: "TUVEES BuyHub", desc: "TUVEES BuyHub serves as an elite, high-converting storefront pre-sales landing page meticulously engineered to turn cold web traffic into eager buyers. The platform delivers an immersive, high-fidelity layout rich with superb visual imagery and premium product graphics explicitly styled to captivate prospective shoppers at first glance. It provides a comprehensive, deep-dive breakdown of technical descriptions, interactive feature logs, and core consumer benefits while seamlessly validating brand authenticity through clear manufacturer profiles. By fusing persuasive copywriting structures with friction-free information layouts, it eliminates buyer hesitation and primes users perfectly for the checkout pipeline.",
     images: ["assets/carousel-image-6a.jpg", "assets/carousel-image-6b.jpg", "assets/carousel-image-6c.jpg"] },

  };

  // 2. Read "?id=" from the address URL
  const urlParams = new URLSearchParams(window.location.search);
  const lookId = urlParams.get('id') || "1"; // Defaults to Look 1 if no ID specified

  const currentProduct = productData[lookId];
  // Append the look ID onto the order button link dynamically
  if (lookId) {
  document.getElementById('orderBtnLink').href = `order-form.html?id=${lookId}`;
  }


  if (currentProduct) {
    // Populate text content
    document.getElementById('productTitle').innerText = currentProduct.title;
    document.getElementById('productDesc').innerText = currentProduct.desc;
    
    // Set initial main image
    document.getElementById('mainImage').src = currentProduct.images[0];

    // FORCE TITLE FIX: Overwrites any layout extensions with your clean page title
    document.title = `${currentProduct.title} - Product Gallery Showcase`;
    
    // Generate thumbnails dynamically
    const thumbRow = document.getElementById('thumbRow');
    currentProduct.images.forEach((imgSrc, index) => {
      const img = document.createElement('img');
      img.src = imgSrc;
      img.className = 'thumb' + (index === 0 ? ' active' : '');
      img.onclick = function() { switchImage(this); };
      thumbRow.appendChild(img);
    });
  }

  // Thumbnail click function
  function switchImage(element) {
    document.getElementById('mainImage').src = element.src;
    let thumbs = document.getElementsByClassName('thumb');
    for (let i = 0; i < thumbs.length; i++) {
      thumbs[i].classList.remove('active');
    }
    element.classList.add('active');
  }
</script>

</body>
</html>
